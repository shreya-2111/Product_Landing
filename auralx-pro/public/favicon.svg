<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle glow behind headphone -->
  <ellipse cx="32" cy="36" rx="18" ry="14" fill="#7c3aed" opacity="0.18"/>

  <!-- Headband arc -->
  <path d="M13 36 Q13 14 32 14 Q51 14 51 36"
        stroke="url(#grad)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>

  <!-- Left arm -->
  <rect x="11" y="33" width="5" height="10" rx="2.5" fill="url(#grad)" opacity="0.6"/>

  <!-- Left ear cup outer -->
  <rect x="8" y="33" width="11" height="18" rx="5.5" fill="#1a0a2e" stroke="url(#grad)" stroke-width="1.8"/>
  <!-- Left ear cup inner cushion -->
  <rect x="11" y="37" width="5" height="10" rx="2.5" fill="#7c3aed" opacity="0.35"/>

  <!-- Right arm -->
  <rect x="48" y="33" width="5" height="10" rx="2.5" fill="url(#grad)" opacity="0.6"/>

  <!-- Right ear cup outer -->
  <rect x="45" y="33" width="11" height="18" rx="5.5" fill="#1a0a2e" stroke="url(#grad)" stroke-width="1.8"/>
  <!-- Right ear cup inner cushion -->
  <rect x="48" y="37" width="5" height="10" rx="2.5" fill="#06b6d4" opacity="0.35"/>

  <!-- LED dot left -->
  <circle cx="13.5" cy="47" r="1.8" fill="#00ff88" opacity="0.9"/>
  <!-- LED dot right -->
  <circle cx="50.5" cy="47" r="1.8" fill="#00ff88" opacity="0.9"/>
</svg>
